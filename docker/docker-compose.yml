name: facelogix

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  model-init:
    image: facelogix-model-init:${RELEASE_TAG:?RELEASE_TAG is required}
    build:
      context: ../face_service
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "download_models.py", "--models-dir", "/models"]
    environment:
      MODELS_DIR: /models
    volumes:
      - face_models:/models
    restart: "no"
    networks: [internal]

  face-service:
    image: facelogix-face:${RELEASE_TAG:?RELEASE_TAG is required}
    build:
      context: ../face_service
      dockerfile: Dockerfile
    environment:
      MODELS_DIR: /models
      LOG_LEVEL: INFO
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-1}
      ORT_INTRA_OP_THREADS: ${ORT_INTRA_OP_THREADS:-2}
      ORT_INTER_OP_THREADS: ${ORT_INTER_OP_THREADS:-1}
    volumes:
      - face_models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  backend:
    image: facelogix-backend:${RELEASE_TAG:?RELEASE_TAG is required}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DEVICE_TOKEN_SECRET: ${DEVICE_TOKEN_SECRET:?DEVICE_TOKEN_SECRET is required}
      FACE_SERVICE_URL: http://face-service:8001
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 10s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  edge:
    image: facelogix-edge:${RELEASE_TAG:?RELEASE_TAG is required}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  face_models:

networks:
  internal:
    driver: bridge
