name: facelogix-dev

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
    environment:
      POSTGRES_USER: ${DB_USER:-facelogix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-facelogix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-init:
    build:
      context: ../face_service
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "download_models.py", "--models-dir", "/models"]
    environment:
      MODELS_DIR: /models
    volumes:
      - face_models:/models
    restart: "no"

  face-service:
    build:
      context: ../face_service
      dockerfile: Dockerfile
    environment:
      MODELS_DIR: /models
      LOG_LEVEL: DEBUG
    volumes:
      - ../face_service:/app
      - face_models:/models:ro
    ports:
      - "8001:8001"
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-facelogix}:${DB_PASSWORD:-devpassword}@postgres:5432/${DB_NAME:-facelogix}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-jwt-secret-change-before-production}
      DEVICE_TOKEN_SECRET: ${DEVICE_TOKEN_SECRET:-development-device-secret-change-production}
      FACE_SERVICE_URL: http://face-service:8001
      CORS_ORIGINS: '["https://localhost:5173"]'
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 10s
      retries: 10

  frontend:
    image: node:20-alpine@sha256:afdf98210b07b586eb71fa22ba2e432e058e4cd1304d31ed60888755b8c865fb
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  face_models:
  frontend_node_modules:
